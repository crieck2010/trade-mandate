[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trade-mandate"
version = "0.1.0"
description = "Machine-readable investment policy: the PM agent's written mandate — versioned, checksummed, human-signed"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "crieck2010" }]
keywords = ["trading", "investment-policy", "risk", "mandate", "quantitative-finance"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
trade-mandate = "trade_mandate.cli:main"

[project.urls]
Homepage = "https://github.com/crieck2010/trade-mandate"
Repository = "https://github.com/crieck2010/trade-mandate"

[tool.setuptools.packages.find]
where = ["src"]
